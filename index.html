<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->

    <!-- CORE META -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="language" content="en" />
    <meta name="author" content="Xvesting" />
    <meta name="copyright" content="Xvesting © 2026" />

    <!-- TITLE + DESCRIPTION -->
    <title><!-- figma:title --></title>
    <meta name="description" content="Xvesting is an AI-powered investing intelligence platform offering real-time market analysis, portfolio insights, automated workflows, and a secure private dataroom." />

    <!-- KEYWORDS -->
    <meta name="keywords" content="Xvesting, AI investing, market analysis, fintech, portfolio analytics, investing AI, market intelligence, dataroom, workflows, financial insights, trading analysis" />

    <!-- CANONICAL -->
    <link rel="canonical" href="https://xvesting.co" />

    <!-- ROBOTS -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- BROWSER RECOGNITION -->
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0A" />
    <meta name="application-name" content="Xvesting" />
    <meta name="apple-mobile-web-app-title" content="Xvesting" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- FAVICONS — same image, all required sizes declared -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- MICROSOFT / EDGE -->
    <meta name="msapplication-TileColor" content="#0A0A0A" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- PERFORMANCE -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://app.xvesting.co" />

    <!-- LANGUAGE & REGION -->
    <link rel="alternate" hreflang="en" href="https://xvesting.ai/" />
    <link rel="alternate" hreflang="x-default" href="https://xvesting.ai/" />

    <!-- OPEN GRAPH BASE (per-page tags injected by React Helmet) -->
    <meta property="og:site_name" content="Xvesting" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <!-- TWITTER / X BASE -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@xvesting" />
    <meta name="twitter:creator" content="@xvesting" />

    <!-- AI CRAWLER RECOGNITION -->
    <meta name="GPTBot" content="allow" />
    <meta name="Claude-Web" content="allow" />
    <meta name="PerplexityBot" content="allow" />
    <meta name="CCBot" content="allow" />
    <meta name="Diffbot" content="allow" />
    <meta name="Applebot" content="allow" />
    <meta name="omgili" content="allow" />
    <meta name="ia_archiver" content="allow" />
    <link rel="ai-content-hint" href="/llms.txt" />

    <!-- SITE VERIFICATION (replace placeholder values via env or CMS) -->
    <meta name="google-site-verification" content="GOOGLE_VERIFICATION_CODE_HERE" />
    <meta name="msvalidate.01" content="BING_VERIFICATION_CODE_HERE" />
    <meta name="yandex-verification" content="YANDEX_VERIFICATION_CODE_HERE" />
    <meta name="baidu-site-verification" content="BAIDU_VERIFICATION_CODE_HERE" />
    <meta name="p:domain_verify" content="PINTEREST_VERIFICATION_CODE_HERE" />

    <!-- SITEMAPS -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="sitemap" type="application/xml" title="Research" href="/sitemap-research.xml" />

    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
